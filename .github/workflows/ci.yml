name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Check release workflows do not auto-publish
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1
      - name: Check canonical SLMP profile JSONs
        shell: pwsh
        run: ./scripts/update_slmp_profile_jsons.ps1 -FailIfChanged

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy slmp scripts

      - name: Build package
        run: python -m build

      - name: Validate wheel and sdist contents
        if: matrix.python-version == '3.14'
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

      - name: Verify self-contained source archive
        if: matrix.python-version == '3.14'
        shell: pwsh
        run: ./scripts/check_source_archive.ps1 -IncludeWorktree
