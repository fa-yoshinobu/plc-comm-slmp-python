name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Check release workflows do not auto-publish
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/check_no_auto_publish.ps1
      - name: Check canonical SLMP profile JSONs
        if: matrix.python-version == '3.10'
        shell: pwsh
        run: ./scripts/update_slmp_profile_jsons.ps1 -FailIfChanged

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy slmp scripts

      - name: Build package
        run: python -m build

      - name: Validate wheel and sdist contents
        if: matrix.python-version == '3.14'
        shell: pwsh
        run: ./scripts/check_package_contents.ps1

  windows-contract-smoke:
    name: Windows representative contract smoke
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install smoke-test dependencies
        run: python -m pip install pytest pytest-asyncio

      - name: Run representative Windows transport lifecycle contracts
        run: >-
          python -m pytest -q
          tests/test_ipv4_contract.py::test_sync_connect_deadline_covers_resolution_and_discards_late_socket
          tests/test_async_client.py::test_async_udp_read_and_close_share_one_connection_ownership_order
          tests/test_async_client.py::test_async_timeout_retires_transport_then_same_client_reconnects_and_exchanges
          tests/test_response_correlation.py::test_async_udp_protocol_retains_only_the_active_matching_response
          tests/test_response_correlation.py::test_sync_tcp_header_and_body_share_one_absolute_deadline
          tests/test_response_correlation.py::test_async_cancellation_after_send_invalidates_transport_generation
          tests/test_socket_options.py::test_tcp_connect_closes_socket_when_required_keepalive_setup_fails
