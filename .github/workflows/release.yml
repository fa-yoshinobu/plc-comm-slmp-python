name: Build GitHub release artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag version without the leading v"
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Resolve existing release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.version }}"
            tag="v${version}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: ${tag}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with: { python-version: "3.11" }

      - name: Verify exact tag checkout and source versions
        shell: bash
        run: |
          tag="${{ steps.release.outputs.tag }}"
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${tag}")"
          python scripts/check_release_version.py --tag "${tag}"
          python -m unittest tests.test_release_version -v

      - name: Check canonical SLMP profile JSONs
        shell: pwsh
        run: ./scripts/update_slmp_profile_jsons.ps1 -FailIfChanged
      # The GitHub-generated source zip is a release artifact, so it is verified
      # here rather than on every push.
      - name: Verify self-contained source archive
        shell: pwsh
        run: ./scripts/check_source_archive.ps1
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
          python scripts/check_release_version.py --tag "${{ steps.release.outputs.tag }}" --dist dist
      - name: Upload
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${tag#v}"
          header="## [${version}]"
          if ! changelog_notes="$(
            awk -v header="${header}" '
              index($0, header) == 1 { capture = 1 }
              capture && /^## \[/ && index($0, header) != 1 { exit }
              capture { print }
              END { if (!capture) exit 1 }
            ' CHANGELOG.md
          )"; then
            echo "::error::CHANGELOG.md is missing release section ${header}."
            exit 1
          fi
          test -n "${changelog_notes}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            current_body="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body)"
            if ! grep -Fq -- "${header}" <<<"${current_body}"; then
              notes_file="${RUNNER_TEMP}/release-notes-${version}.md"
              printf '%s\n\n%s\n' "${changelog_notes}" "${current_body}" > "${notes_file}"
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --title "Release ${tag}" --notes-file "${notes_file}"
            fi
            gh release upload "${tag}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${tag}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --title "Release ${tag}" --notes "${changelog_notes}" --generate-notes --draft
          fi
