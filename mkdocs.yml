site_dir: _site
docs_dir: docsrc
site_name: SLMP Connect Python
site_url: https://fa-yoshinobu.github.io/plc-comm-docs-site/slmp/python/
repo_url: https://github.com/fa-yoshinobu/plc-comm-slmp-python
repo_name: GitHub
theme:
  name: material
  palette:
    scheme: slate
    primary: blue
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search

validation:
  nav:
    omitted_files: ignore

exclude_docs: |
  internal_docs/**
  maintainer/**
  validation/**

nav:
  - User Docs:
      - Getting Started: user/GETTING_STARTED.md
      - Usage Guide: user/USAGE_GUIDE.md
      - Supported PLC Registers: user/SUPPORTED_REGISTERS.md
      - PLC Profiles: user/PROFILES.md
      - Gotchas: user/GOTCHAS.md
      - Error Codes: user/ERROR_CODES.md
      - Device Table: user/BIT_DEVICE_ACCESS_TABLE.md
